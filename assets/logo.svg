<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="flaskGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5a0" />
      <stop offset="100%" stop-color="#00d2ff" />
    </linearGradient>
    <linearGradient id="elemGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2027" />
      <stop offset="100%" stop-color="#203a43" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Periodic Table Box "Br" -->
  <rect x="10" y="10" width="80" height="80" rx="12" fill="url(#elemGrad)" stroke="#00f5a0" stroke-width="2.5" />
  
  <!-- Atomic Number 35 -->
  <text x="18" y="26" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="10" font-weight="700" fill="#00d2ff">35</text>
  <text x="82" y="26" font-family="'JetBrains Mono', 'Courier New', monospace" font-size="8" font-weight="400" fill="#94a3b8" text-anchor="end">79.90</text>
  
  <!-- Element Symbol "Br" -->
  <text x="32" y="58" font-family="'Outfit', 'Inter', sans-serif" font-size="34" font-weight="800" fill="#ffffff" filter="url(#glow)">Br</text>
  
  <!-- Element Name "Bromine" & Subtitle "Lab Intelligence" -->
  <text x="50" y="74" font-family="'Inter', sans-serif" font-size="8" font-weight="600" fill="#00f5a0" text-anchor="middle" letter-spacing="1">HEISENBERG</text>
  <text x="50" y="84" font-family="'Inter', sans-serif" font-size="6" font-weight="500" fill="#94a3b8" text-anchor="middle" letter-spacing="0.5">CLOUD LAB INTELLIGENCE</text>
  
  <!-- Subtle Flask Icon overlay in top right -->
  <path d="M 68 18 L 74 18 L 74 24 L 78 30 C 79 32 78 34 76 34 L 66 34 C 64 34 63 32 64 30 L 68 24 Z" fill="none" stroke="url(#flaskGrad)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.6"/>
  <circle cx="71" cy="29" r="1" fill="#00f5a0" opacity="0.8"/>
</svg>
